<!DOCTYPE html>

{% extends "base.html" %}
{% block title %} {{car}} {% endblock %}

{% block content %}
<div class="card-body p-0">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
                <tr>
                    <th>Make</th>
                    <th>Model</th>
                    <th>License Plate</th>
                    <th>Vin Code</th>
                    <th>Client Name</th>
                </tr>
            </thead>

            <tbody>
                {% if car %}
                <tr>
                    <td>{{ car.make }}</td>
                    <td>{{ car.model }}</td>
                    <td>{{ car.license_plate }}</td>
                    <td>{{ car.vin_code }}</td>
                    <td>{{ car.client_name }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center">No car found.</td>
                </tr>
                {% endif %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
