<!DOCTYPE html>

{%  load static %}

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

<title>Auto Service</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'autoservice/css/style.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<style>
    body {
        min-height: 100vh;
        background: linear-gradient(135deg, #eaf4ff, #ffffff);
    }

    .navbar {
        background: #1565c0;
    }

    .navbar-brand {
        font-weight: 600;
    }

    .page-header {
        padding: 50px 20px;
        background: linear-gradient(135deg, #1976d2, #64b5f6);
        color: white;
    }

    .content {
        padding-top: 40px;
        padding-bottom: 40px;
    }

    .card {
        border: none;
        border-radius: 12px;
    }
</style>


</head>

<body>

{% include "includes/nav_bar.html" %}

<header class="page-header text-center">
    <div class="container">
        <h1 class="display-5 fw-bold">{% block title %}Auto Service{% endblock %}</h1>
        <p class="lead mb-0">Vehicle service management</p>
    </div>
</header>

<main class="container content">


{% block content %}
{% endblock %}


</main>

<footer class="text-center text-muted py-4">
    <div class="container">
        <small>Auto Service</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
